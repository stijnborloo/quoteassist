<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Interactieve zaal — 360° AV-beleving</title>
<style>
  :root{
    --bg:#0c0c10; --panel:#15161c; --ink:#f3f4f7; --muted:#9aa0ab; --line:rgba(255,255,255,.10);
    --brand:#BE1622;
    --mic:#22d3ee; --spk:#f5b642; --cam:#a78bfa; --scr:#ff4d5e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden;
    overscroll-behavior:none;touch-action:none;}
  #stage{position:fixed;inset:0;overflow:hidden;background:#000;cursor:grab;}
  #stage.grabbing{cursor:grabbing;}
  #view{position:absolute;inset:0;width:100%;height:100%;display:block;}
  #layer{position:absolute;inset:0;pointer-events:none;}

  /* ── top bar ─────────────────────────────────────────── */
  .topbar{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;
    gap:10px;padding:12px 14px;
    background:linear-gradient(180deg,rgba(8,8,11,.75),rgba(8,8,11,0));pointer-events:none;}
  .topbar .brand{width:8px;height:22px;border-radius:2px;background:var(--brand);flex:0 0 auto;}
  .topbar .t{font-size:14px;font-weight:700;}
  .topbar .s{font-size:11px;color:var(--muted);font-weight:500;margin-top:1px;}

  /* ── hint ────────────────────────────────────────────── */
  .hint{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:15;
    display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none;
    color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);transition:opacity .5s;}
  .hint svg{width:44px;height:44px;animation:sway 2.4s ease-in-out infinite;}
  .hint span{font-size:12.5px;font-weight:600;opacity:.92;}
  @keyframes sway{0%,100%{transform:translateX(-12px)}50%{transform:translateX(12px)}}

  /* ── hotspots ────────────────────────────────────────── */
  .hs{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none;}
  .hs .pin{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    border:2px solid rgba(255,255,255,.92);box-shadow:0 4px 14px rgba(0,0,0,.5);
    z-index:3;pointer-events:auto;cursor:pointer;}
  .hs .pin svg{width:18px;height:18px;fill:#fff;}
  .hs .pin::before{content:"";position:absolute;inset:-2px;border-radius:50%;
    border:2px solid currentColor;opacity:.55;animation:idle 2s ease-out infinite;}
  @keyframes idle{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.1);opacity:0}}
  .hs .pin-lbl{position:absolute;left:0;top:0;transform:translate(-50%,22px);
    font-size:10px;font-weight:700;white-space:nowrap;padding:2px 7px;border-radius:100px;
    background:rgba(10,10,14,.75);color:#fff;z-index:3;opacity:0;transition:opacity .2s;}
  .hs.active .pin-lbl{opacity:1;}
  .hs .pin-mic{background:var(--mic);color:var(--mic);} .hs .pin-spk{background:var(--spk);color:var(--spk);}
  .hs .pin-cam{background:var(--cam);color:var(--cam);} .hs .pin-scr{background:var(--scr);color:var(--scr);}

  .fx{position:absolute;left:0;top:0;width:0;height:0;z-index:2;opacity:0;transition:opacity .3s;}
  .hs.active .fx{opacity:1;}
  .fx span{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%);
    border:2px solid currentColor;width:34px;height:34px;}

  .fx-mic{color:var(--mic);}
  .hs.active .fx-mic span{animation:micIn 2.4s ease-out infinite;}
  .hs.active .fx-mic span:nth-child(2){animation-delay:.8s;}
  .hs.active .fx-mic span:nth-child(3){animation-delay:1.6s;}
  @keyframes micIn{0%{width:180px;height:180px;opacity:0}20%{opacity:.85}100%{width:34px;height:34px;opacity:0}}
  .fx-mic .beam{position:absolute;left:0;top:0;width:180px;height:180px;
    transform:translate(-50%,-50%);border-radius:50%;
    background:conic-gradient(from -30deg,transparent 0deg,rgba(34,211,238,.30) 30deg,transparent 70deg);
    animation:sweep 4s linear infinite;}
  @keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg)}}

  .fx-spk{color:var(--spk);}
  .hs.active .fx-spk span{animation:spkOut 2.2s ease-out infinite;}
  .hs.active .fx-spk span:nth-child(2){animation-delay:.73s;}
  .hs.active .fx-spk span:nth-child(3){animation-delay:1.46s;}
  @keyframes spkOut{0%{width:26px;height:26px;opacity:.9}100%{width:180px;height:180px;opacity:0}}

  .fx-cam{color:var(--cam);}
  .fx-cam .frame{position:absolute;left:0;top:0;width:150px;height:96px;transform:translate(-50%,-50%);}
  .fx-cam .frame i{position:absolute;width:22px;height:22px;border:3px solid var(--cam);}
  .fx-cam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;}
  .fx-cam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;}
  .fx-cam .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;}
  .fx-cam .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;}
  .hs.active .fx-cam .frame{animation:reframe 3.2s ease-in-out infinite;}
  @keyframes reframe{0%,100%{width:180px;height:112px;opacity:.55}45%,60%{width:120px;height:80px;opacity:1}}

  .fx-scr{color:var(--scr);}
  .fx-scr .glow{position:absolute;left:0;top:0;width:210px;height:132px;transform:translate(-50%,-50%);
    border-radius:8px;box-shadow:0 0 0 2px rgba(255,77,94,.65),0 0 42px 8px rgba(255,77,94,.38);}
  .hs.active .fx-scr .glow{animation:glow 2.4s ease-in-out infinite;}
  @keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
  .fx-scr .live{position:absolute;left:0;top:0;transform:translate(-50%,-86px);
    font-size:9px;font-weight:800;letter-spacing:.6px;color:#fff;background:var(--scr);
    padding:3px 8px;border-radius:100px;display:flex;align-items:center;gap:5px;}
  .fx-scr .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#fff;
    animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:.2}}

  /* ── dock ────────────────────────────────────────────── */
  .dock{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:14px 12px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(8,8,11,.92),rgba(8,8,11,0));}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:9px 13px;border-radius:100px;
    background:var(--panel);border:1.5px solid var(--line);font-size:12px;font-weight:700;cursor:pointer;}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor;}
  .chip.mic{color:var(--mic);} .chip.spk{color:var(--spk);} .chip.cam{color:var(--cam);} .chip.scr{color:var(--scr);}
  .chip .txt{color:var(--ink);}
  .chip.on{border-color:currentColor;background:rgba(255,255,255,.06);}
  .chip.on .txt{color:currentColor;}
  .play{display:flex;align-items:center;gap:8px;padding:11px 16px;border-radius:100px;
    background:var(--brand);border:none;color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;}
  .play svg{width:14px;height:14px;fill:#fff;}
  .play.playing{background:#2a2b33;}

  /* ── sheet ───────────────────────────────────────────── */
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;transform:translateY(110%);
    transition:transform .28s cubic-bezier(.2,.7,.2,1);background:var(--panel);
    border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:16px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.55);}
  .sheet.open{transform:translateY(0);}
  .sheet .grip{width:38px;height:4px;border-radius:100px;background:var(--line);margin:0 auto 12px;}
  .sh-head{display:flex;align-items:center;gap:11px;margin-bottom:6px;}
  .sh-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .sh-ic svg{width:20px;height:20px;fill:#fff;}
  .sh-title{font-size:16px;font-weight:800;}
  .sh-kicker{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;opacity:.7;}
  .sh-body{font-size:13.5px;line-height:1.55;color:#d7dae1;margin-top:6px;}
  .sh-x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;
    background:rgba(255,255,255,.08);border:none;color:#fff;font-size:15px;cursor:pointer;}

  #cap{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);z-index:25;max-width:88%;
    text-align:center;background:rgba(8,8,11,.85);color:#fff;font-size:13.5px;font-weight:600;
    line-height:1.4;padding:10px 16px;border-radius:12px;opacity:0;transition:opacity .3s;
    border:1px solid rgba(255,255,255,.1);pointer-events:none;}

  @media (prefers-reduced-motion: reduce){
    .fx span,.fx-mic .beam,.fx-cam .frame,.fx-scr .glow,.hint svg,.hs .pin::before{animation:none !important;}
    .fx-mic span,.fx-spk span{opacity:.7;width:130px;height:130px;}
  }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="layer"></div>
  </div>

  <div class="topbar">
    <div class="brand"></div>
    <div>
      <div class="t">Vergaderzaal — Ricoh AV</div>
      <div class="s">Sleep om rond te kijken · tik op een puntje</div>
    </div>
  </div>

  <div class="hint" id="hint">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
      <path d="M4 12h16M4 12l4-4M4 12l4 4M20 12l-4-4M20 12l-4 4"/>
    </svg>
    <span>Sleep om rond te kijken</span>
  </div>

  <div class="dock">
    <div class="chips" id="chips"></div>
    <button class="play" id="playBtn">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="playLbl">Speel scenario af</span>
    </button>
  </div>

  <div class="sheet" id="sheet">
    <button class="sh-x" id="shX">&times;</button>
    <div class="grip"></div>
    <div class="sh-head">
      <div class="sh-ic" id="shIc"></div>
      <div>
        <div class="sh-kicker" id="shKicker"></div>
        <div class="sh-title" id="shTitle"></div>
      </div>
    </div>
    <div class="sh-body" id="shBody"></div>
  </div>

  <div id="cap"></div>

<script>
"use strict";
/* ══════════════════════════════════════════════════════════════
   Volledig zelfstandig. Geen CDN, geen WebGL, geen externe foto.
   Werkt daardoor ook vanaf een lokaal bestand (file://).
   ══════════════════════════════════════════════════════════════ */

var ICON = {
  mic:'<svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2z"/></svg>',
  spk:'<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>',
  cam:'<svg viewBox="0 0 24 24"><path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/></svg>',
  scr:'<svg viewBox="0 0 24 24"><path d="M21 3H3a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h7v2H8v2h8v-2h-2v-2h7a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm-1 12H4V5h16v10z"/></svg>'
};
var SYS = {
  mic:{label:'Microfoon',kicker:'Opname',color:'#22d3ee',
    body:'Plafondmicrofoon met beamforming. Hij richt zich automatisch op wie er spreekt en onderdrukt ruis van airco, laptops en toetsenborden. De ringen tonen het opnamebereik — elke stoel valt binnen de zone.'},
  spk:{label:'Luidsprekers',kicker:'Geluid',color:'#f5b642',
    body:'Gelijkmatige geluidsdekking over de volledige tafel. Geen dode hoeken: iedereen hoort de verre kant even helder, vooraan én achteraan.'},
  cam:{label:'Camera',kicker:'Beeld',color:'#a78bfa',
    body:'AI-camera met auto-framing. Ze kadreert de groep en zoomt in op wie het woord neemt. Het kader toont precies wat de verre kant ziet.'},
  scr:{label:'Scherm',kicker:'Delen',color:'#ff4d5e',
    body:'Draadloos delen en een Teams- of Zoom-gesprek starten met één tik. Content en deelnemers staan naast elkaar op het grote scherm.'}
};

/* ── 1) De zaal tekenen als equirectangulair beeld ─────────── */
var PW = 2048, PH = 1024;
function px(yaw,pitch){ return { x:(yaw+180)/360*PW, y:(90-pitch)/180*PH }; }

function rr(g,x,y,w,h,r){ g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

function buildPano(){
  var c=document.createElement('canvas'); c.width=PW; c.height=PH;
  var g=c.getContext('2d');

  var cg=g.createLinearGradient(0,0,0,PH*.34);
  cg.addColorStop(0,'#eceef2'); cg.addColorStop(1,'#d3d7de');
  g.fillStyle=cg; g.fillRect(0,0,PW,PH*.34);
  var wg=g.createLinearGradient(0,PH*.34,0,PH*.64);
  wg.addColorStop(0,'#ccd0d7'); wg.addColorStop(1,'#b3b8c1');
  g.fillStyle=wg; g.fillRect(0,PH*.34,PW,PH*.30);
  var fg=g.createLinearGradient(0,PH*.64,0,PH);
  fg.addColorStop(0,'#8d929b'); fg.addColorStop(1,'#5f646c');
  g.fillStyle=fg; g.fillRect(0,PH*.64,PW,PH*.36);

  g.strokeStyle='rgba(0,0,0,.06)'; g.lineWidth=2;
  for(var s=0;s<PW;s+=160){ g.beginPath(); g.moveTo(s,PH*.34); g.lineTo(s,PH*.64); g.stroke(); }
  g.strokeStyle='rgba(0,0,0,.10)'; g.lineWidth=3;
  g.beginPath(); g.moveTo(0,PH*.64); g.lineTo(PW,PH*.64); g.stroke();

  // tafel + stoelen
  var tp=px(0,-50); g.save(); g.translate(tp.x,tp.y);
  var tg=g.createLinearGradient(0,-95,0,95); tg.addColorStop(0,'#5d4a3b'); tg.addColorStop(1,'#3d2f24');
  g.fillStyle=tg; g.beginPath(); g.ellipse(0,0,450,98,0,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(255,255,255,.14)'; g.lineWidth=3; g.stroke();
  g.fillStyle='#2b2e35';
  for(var i=-2;i<=2;i++){
    g.beginPath(); g.ellipse(i*152,-122,35,26,0,0,Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(i*152, 122,35,26,0,0,Math.PI*2); g.fill();
  }
  g.restore();

  // voorwand + scherm
  var sp=px(0,0); g.save(); g.translate(sp.x,sp.y);
  g.fillStyle='#2b2d34'; rr(g,-245,-170,490,340,10); g.fill();
  var sg=g.createLinearGradient(0,-120,0,120); sg.addColorStop(0,'#13263f'); sg.addColorStop(1,'#0a1626');
  g.fillStyle=sg; rr(g,-200,-120,400,240,8); g.fill();
  g.strokeStyle='#0a0c10'; g.lineWidth=8; rr(g,-200,-120,400,240,8); g.stroke();
  g.fillStyle='rgba(125,175,235,.24)'; rr(g,-176,-96,168,120,6); g.fill(); rr(g,8,-96,168,120,6); g.fill();
  g.fillStyle='rgba(255,255,255,.10)'; rr(g,-176,36,352,60,6); g.fill();
  g.fillStyle='#BE1622'; g.fillRect(-200,-146,54,12);
  g.fillStyle='#e9ebef'; g.font='700 22px Arial'; g.fillText('RICOH',-140,-135);
  g.restore();

  // apparatuur
  dev(g,px(0,14),100,26,'lens');    // camera
  dev(g,px(0,-13),300,22,'grille'); // soundbar
  disc(g,px(0,58),24,'mic');
  disc(g,px(-48,44),26,'spk');
  disc(g,px(48,44),26,'spk');

  // raam rechts
  var w=px(115,2); g.save(); g.translate(w.x,w.y);
  var kg=g.createLinearGradient(0,-92,0,92); kg.addColorStop(0,'#c4e3f7'); kg.addColorStop(1,'#8fbfe0');
  g.fillStyle=kg; g.fillRect(-135,-92,270,184);
  g.strokeStyle='#eceef2'; g.lineWidth=9; g.strokeRect(-135,-92,270,184);
  g.beginPath(); g.moveTo(0,-92); g.lineTo(0,92); g.moveTo(-135,0); g.lineTo(135,0); g.stroke();
  g.restore();

  // deur links
  var d=px(-118,-8); g.save(); g.translate(d.x,d.y);
  g.fillStyle='#9aa0a8'; g.fillRect(-72,-145,144,290);
  g.strokeStyle='#7b818a'; g.lineWidth=5; g.strokeRect(-72,-145,144,290);
  g.fillStyle='#c9ccd2'; g.beginPath(); g.arc(50,0,7,0,Math.PI*2); g.fill();
  g.restore();

  // achterwand: plant + kast
  var b=px(180,-14); g.save(); g.translate(b.x,b.y);
  g.fillStyle='#3f434a'; rr(g,-180,-40,360,150,6); g.fill();
  g.fillStyle='#2f6b4f'; g.beginPath(); g.ellipse(230,-30,42,58,0,0,Math.PI*2); g.fill();
  g.fillStyle='#6b5140'; g.fillRect(214,20,32,54);
  g.restore();

  return c;
}
function dev(g,p,w,h,kind){ g.save(); g.translate(p.x,p.y);
  g.fillStyle='#1b1d23'; rr(g,-w/2,-h/2,w,h,h/2); g.fill();
  if(kind==='lens'){ g.fillStyle='#3aa0ff'; g.beginPath(); g.arc(0,0,6,0,Math.PI*2); g.fill(); }
  else { g.fillStyle='rgba(255,255,255,.16)';
    for(var i=-w/2+16;i<w/2-10;i+=14){ g.beginPath(); g.arc(i,0,2.4,0,Math.PI*2); g.fill(); } }
  g.restore(); }
function disc(g,p,r,kind){ g.save(); g.translate(p.x,p.y);
  g.fillStyle=(kind==='mic')?'#1b1d23':'#20222a';
  g.beginPath(); g.arc(0,0,r,0,Math.PI*2); g.fill();
  g.strokeStyle='rgba(255,255,255,.16)'; g.lineWidth=2; g.stroke();
  if(kind==='mic'){ g.fillStyle='rgba(255,255,255,.20)';
    for(var a=0;a<8;a++){ var t=a/8*Math.PI*2; g.beginPath();
      g.arc(Math.cos(t)*r*.5,Math.sin(t)*r*.5,2.2,0,Math.PI*2); g.fill(); } }
  else { g.fillStyle='#12141a'; g.beginPath(); g.arc(0,0,r*.4,0,Math.PI*2); g.fill(); }
  g.restore(); }

/* ══════════════════════════════════════════════════════════════
   INSTELLING — zet hier je eigen 360°-foto.
   Laat leeg ("") om de getekende voorbeeldzaal te gebruiken.
   De foto moet equirectangulair zijn (verhouding 2:1, bv. 4096×2048)
   en naast dit bestand in de repo staan, bv.:  "zaal.jpg"
   ══════════════════════════════════════════════════════════════ */
var PANO_URL = "";

/* ── 2) Eigen 360°-viewer (canvas 2D, geen WebGL) ──────────── */
var PANO = buildPano();          // bron: canvas óf foto
var stage=document.getElementById('stage'), cv=document.getElementById('view'),
    ctx=cv.getContext('2d'), layer=document.getElementById('layer');
var VW=0, VH=0, DPR=Math.min(window.devicePixelRatio||1, 2);
var HFOV=90;                       // horizontale kijkhoek in graden
var cam={yaw:0, pitch:2};

function resize(){
  VW=stage.clientWidth; VH=stage.clientHeight;
  cv.width=VW*DPR; cv.height=VH*DPR;
  cv.style.width=VW+'px'; cv.style.height=VH+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.imageSmoothingEnabled=true;
  draw();
}
function vfov(){ return HFOV*VH/VW; }

// yaw/pitch → schermpositie (zelfde lineaire mapping als bij het tekenen)
function project(yaw,pitch){
  var dy=((yaw-cam.yaw+540)%360)-180;              // kortste hoekafstand, wrapt netjes
  return { x:VW/2 + dy/HFOV*VW,
           y:VH/2 - (pitch-cam.pitch)/vfov()*VH,
           vis:Math.abs(dy) < HFOV*0.75 };
}

function draw(){
  if(!VW||!VH) return;
  var SW = PANO.naturalWidth  || PANO.width;    // werkt voor <img> én <canvas>
  var SH = PANO.naturalHeight || PANO.height;
  if(!SW||!SH) return;

  var sw=HFOV/360*SW, sh=vfov()/180*SH;
  var sx=(cam.yaw+180)/360*SW - sw/2;
  var sy=(90-cam.pitch)/180*SH - sh/2;
  ctx.clearRect(0,0,VW,VH);

  // verticaal binnen het beeld houden
  var top=sy, hgt=sh, dTop=0, dH=VH;
  if(top<0){ dTop = -top/sh*VH; hgt += top; top=0; dH=VH-dTop; }
  if(top+hgt>SH){ var over=top+hgt-SH; hgt-=over; dH -= over/sh*VH; }
  if(hgt<=0) return;

  // horizontaal wrappen: teken in twee stukken als de rand overschreden wordt
  var x=((sx%SW)+SW)%SW;
  var first=Math.min(sw, SW-x);
  ctx.drawImage(PANO, x, top, first, hgt, 0, dTop, first/sw*VW, dH);
  if(first<sw){
    ctx.drawImage(PANO, 0, top, sw-first, hgt, first/sw*VW, dTop, (sw-first)/sw*VW, dH);
  }
  positionHotspots();
}

/* ── 3) Hotspots ───────────────────────────────────────────── */
var HOTSPOTS=[
  {sys:'mic',yaw:0,pitch:58},
  {sys:'cam',yaw:0,pitch:14},
  {sys:'scr',yaw:0,pitch:0},
  {sys:'spk',yaw:-48,pitch:44},
  {sys:'spk',yaw:48,pitch:44}
];
var STATE={mic:false,spk:false,cam:false,scr:false};

function fxHTML(sys){
  if(sys==='cam') return '<div class="fx fx-cam"><div class="frame"><i></i><i></i><i></i><i></i></div></div>';
  if(sys==='scr') return '<div class="fx fx-scr"><div class="glow"></div><div class="live">LIVE</div></div>';
  var beam = sys==='mic' ? '<div class="beam"></div>' : '';
  return '<div class="fx fx-'+sys+'">'+beam+'<span></span><span></span><span></span></div>';
}
function buildHotspots(){
  HOTSPOTS.forEach(function(h){
    var d=document.createElement('div');
    d.className='hs';
    d.innerHTML=fxHTML(h.sys)
      +'<div class="pin pin-'+h.sys+'">'+ICON[h.sys]+'</div>'
      +'<div class="pin-lbl">'+SYS[h.sys].label+'</div>';
    d.querySelector('.pin').addEventListener('click', function(ev){
      ev.stopPropagation(); toggle(h.sys); if(STATE[h.sys]) openSheet(h.sys);
    });
    layer.appendChild(d); h.el=d;
  });
}
function positionHotspots(){
  HOTSPOTS.forEach(function(h){
    var p=project(h.yaw,h.pitch);
    h.el.style.display = p.vis ? 'block' : 'none';
    if(p.vis) h.el.style.transform='translate('+p.x+'px,'+p.y+'px)';
  });
}
function toggle(sys){ setSys(sys, !STATE[sys]); }
function setSys(sys,on){
  STATE[sys]=on;
  HOTSPOTS.forEach(function(h){ if(h.sys===sys) h.el.classList.toggle('active',on); });
  var c=document.getElementById('chip-'+sys); if(c) c.classList.toggle('on',on);
}

/* ── 4) Slepen ─────────────────────────────────────────────── */
var drag=null;
function pt(e){ var t=e.touches?e.touches[0]:e; return {x:t.clientX,y:t.clientY}; }
function down(e){ drag={p:pt(e),yaw:cam.yaw,pitch:cam.pitch}; stage.classList.add('grabbing'); killHint(); stopScenario(); }
function move(e){
  if(!drag) return;
  e.preventDefault();
  var p=pt(e);
  cam.yaw = drag.yaw - (p.x-drag.p.x)/VW*HFOV;
  cam.pitch = Math.max(-70, Math.min(80, drag.pitch + (p.y-drag.p.y)/VH*vfov()));
  draw();
}
function up(){ drag=null; stage.classList.remove('grabbing'); }
stage.addEventListener('mousedown',down); window.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
stage.addEventListener('touchstart',down,{passive:true});
stage.addEventListener('touchmove',move,{passive:false});
stage.addEventListener('touchend',up);
window.addEventListener('resize',resize);

/* ── 5) Chips + sheet ──────────────────────────────────────── */
function buildChips(){
  var w=document.getElementById('chips');
  Object.keys(SYS).forEach(function(sys){
    var b=document.createElement('button');
    b.className='chip '+sys; b.id='chip-'+sys;
    b.innerHTML='<span class="dot"></span><span class="txt">'+SYS[sys].label+'</span>';
    b.onclick=function(){ toggle(sys); if(STATE[sys]) openSheet(sys); };
    w.appendChild(b);
  });
}
function openSheet(sys){
  var s=SYS[sys];
  document.getElementById('shKicker').textContent=s.kicker;
  document.getElementById('shTitle').textContent=s.label;
  document.getElementById('shBody').textContent=s.body;
  var ic=document.getElementById('shIc'); ic.style.background=s.color; ic.innerHTML=ICON[sys];
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); }
document.getElementById('shX').onclick=closeSheet;

var hintDead=false;
function killHint(){ if(hintDead) return; hintDead=true;
  var h=document.getElementById('hint'); h.style.opacity='0';
  setTimeout(function(){ h.style.display='none'; },600); }
setTimeout(killHint,6500);

/* ── 6) Scenario ───────────────────────────────────────────── */
var timers=[], playing=false, anim=null;
var SCENE=[
  {at:0,    on:['mic'],                   look:{yaw:0,pitch:50}, cap:'Een deelnemer neemt het woord…'},
  {at:2800, on:['mic','cam'],             look:{yaw:0,pitch:8},  cap:'De camera kadreert automatisch de spreker'},
  {at:5600, on:['mic','cam','spk'],       look:{yaw:-42,pitch:38},cap:'De verre kant antwoordt — helder over de hele tafel'},
  {at:8400, on:['mic','cam','spk','scr'], look:{yaw:0,pitch:0},  cap:'Presentatie draadloos op het grote scherm'}
];
function easeTo(yaw,pitch,ms){
  if(anim) cancelAnimationFrame(anim);
  var y0=cam.yaw, p0=cam.pitch, t0=performance.now();
  var dy=((yaw-y0+540)%360)-180;
  (function step(t){
    var k=Math.min(1,(t-t0)/ms), e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    cam.yaw=y0+dy*e; cam.pitch=p0+(pitch-p0)*e; draw();
    if(k<1) anim=requestAnimationFrame(step);
  })(t0);
}
var capEl=document.getElementById('cap');
function cap(t){ capEl.textContent=t; capEl.style.opacity='1'; }
function uncap(){ capEl.style.opacity='0'; }

document.getElementById('playBtn').onclick=function(){ playing?stopScenario():startScenario(); };
function startScenario(){
  playing=true; closeSheet();
  document.getElementById('playBtn').classList.add('playing');
  document.getElementById('playLbl').textContent='Stop';
  Object.keys(SYS).forEach(function(s){ setSys(s,false); });
  SCENE.forEach(function(st){
    timers.push(setTimeout(function(){
      Object.keys(SYS).forEach(function(s){ setSys(s, st.on.indexOf(s)>=0); });
      easeTo(st.look.yaw, st.look.pitch, 1300);
      cap(st.cap);
    }, st.at));
  });
  timers.push(setTimeout(function(){ cap('Alles werkt samen — dit ervaart uw team elke vergadering.'); },11300));
  timers.push(setTimeout(stopScenario,14500));
}
function stopScenario(){
  if(!playing) return;
  playing=false;
  timers.forEach(clearTimeout); timers=[];
  document.getElementById('playBtn').classList.remove('playing');
  document.getElementById('playLbl').textContent='Speel scenario af';
  uncap();
}

/* ── 7) Panoramabron laden ─────────────────────────────────── */
function badge(txt){
  var b=document.getElementById('srcbadge');
  if(!b){ b=document.createElement('div'); b.id='srcbadge';
    b.style.cssText='position:fixed;top:12px;right:12px;z-index:22;font-size:9.5px;'
      +'color:#9aa0ab;border:1px solid rgba(255,255,255,.1);border-radius:100px;'
      +'padding:4px 9px;background:rgba(8,8,11,.55);pointer-events:none;';
    document.body.appendChild(b); }
  b.textContent=txt;
}
function loadPano(){
  if(!PANO_URL){ badge('Getekende voorbeeldzaal'); draw(); return; }
  badge('360°-foto laden…');
  var done=false;
  var img=new Image();
  var t=setTimeout(function(){
    if(done) return; done=true;
    badge('Foto laadt niet — voorbeeldzaal'); draw();
  }, 8000);
  img.onload=function(){
    if(done) return; done=true; clearTimeout(t);
    PANO=img;
    badge(Math.abs(img.naturalWidth/img.naturalHeight-2)>0.1
      ? 'Let op: foto is niet 2:1' : '360°-foto');
    draw();
  };
  img.onerror=function(){
    if(done) return; done=true; clearTimeout(t);
    badge('Foto niet gevonden — voorbeeldzaal'); draw();
  };
  img.src=PANO_URL;
}

/* ── 8) Start ──────────────────────────────────────────────── */
buildChips();
buildHotspots();
resize();
loadPano();
</script>
